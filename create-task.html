<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Helpdesk - Create Task</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Header -->

    <header class="dashboard-header">

        <h1>Mini Helpdesk</h1>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </header>


    <!-- Main Content -->

    <main class="dashboard-container">

        <div class="form-page">

            <h2>Create New Task</h2>

            <p class="dashboard-subtitle">
                Create a new helpdesk task
            </p>


            <form id="taskForm">


                <!-- Task Title -->

                <div class="form-group">

                    <label for="taskTitle">
                        Task Title
                    </label>

                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="Enter task title"
                        required
                    >

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label for="taskDescription">
                        Description
                    </label>

                    <textarea
                        id="taskDescription"
                        placeholder="Describe the problem or task"
                        rows="5"
                        required
                    ></textarea>

                </div>


                <!-- Status -->

                <div class="form-group">

                    <label for="taskStatus">
                        Status
                    </label>

                    <select id="taskStatus">

                        <option value="Open">
                            Open
                        </option>

                        <option value="In Progress">
                            In Progress
                        </option>

                        <option value="On Hold">
                            On Hold
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                    </select>

                </div>


                <!-- Priority -->

                <div class="form-group">

                    <label for="taskPriority">
                        Priority
                    </label>

                    <select id="taskPriority">

                        <option value="Low">
                            Low
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="High">
                            High
                        </option>

                        <option value="Critical">
                            Critical
                        </option>

                    </select>

                </div>


                <!-- Buttons -->

                <div class="form-buttons">

                    <button
                        type="submit"
                        class="create-task-btn"
                    >
                        Create Task
                    </button>


                    <button
                        type="button"
                        class="cancel-btn"
                        onclick="goBack()"
                    >
                        Cancel
                    </button>

                </div>


            </form>

        </div>

    </main>


    <script>

        function logout() {

            window.location.href = "index.html";

        }


        function goBack() {

            window.location.href = "dashboard.html";

        }

    </script>
<script src="app.js"></script>
</body>

</html>
